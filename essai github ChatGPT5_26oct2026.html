<!-- Ci-dessus code proposé par ChatGPT le 26 octobre 2026 en réponse à ma question : pourquoi ce code html affiche-t-il les textes mais pas l'image ?

Le problème vient très probablement de l'URL indiquée dans l'attribut src de votre balise <img>. L'adresse d'une image sur GitHub n'est pas nécessairement l'adresse directe du fichier image.

Dans votre code, plusieurs points méritent d'être corrigés.
1. Corriger l'adresse de l'image
Vous avez écrit :
<img src="https://github.com/joelcharmet69/Joel_GIT_Repo/Carl_Blechen_esquisse_jardin_villa_d_este.jpg" width=300 height=600/>

Cette adresse ne précise pas la branche du dépôt ni le chemin d'accès au fichier dans cette branche. Pour afficher une image dans une page HTML, il faut fournir une URL qui renvoie directement les données de l'image, et non une page GitHub qui présente le fichier.

Sur GitHub, vous pouvez obtenir cette adresse en ouvrant le fichier image dans votre dépôt, puis en cliquant sur Raw. L'adresse obtenue commence généralement par https://raw.githubusercontent.com/.

Pour votre dépôt, l'adresse devrait avoir cette forme :
<img src="https://raw.githubusercontent.com/joelcharmet69/Joel_GIT_Repo/main/Carl_Blechen_esquisse_jardin_villa_d_este.jpg"
     width="300" height="600"
     alt="Le jardin de la villa d'Este">


Attention : main est ici une hypothèse. Si votre fichier se trouve dans une autre branche, ou dans un sous-dossier, il faudra adapter l'adresse. La documentation GitHub explique la différence entre l'adresse d'une page de dépôt et celle d'une image directement accessible.
